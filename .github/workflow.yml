name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # ===== FRONTEND =====

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        working-directory: ./easyway-frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./easyway-frontend
        run: npm run build

      # ===== BACKEND =====

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Spring Boot
        working-directory: ./easyway-backend
        run: mvn clean package -DskipTests

      # ===== SONARCLOUD =====

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ===== DOCKER =====

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build -t pritxsh/app-frontend:${{ github.run_number }} ./easyway-frontend
          docker tag pritxsh/app-frontend:${{ github.run_number }} pritxsh/app-frontend:latest

      - name: Build Backend Image
        run: |
          docker build -t pritxsh/app-backend:${{ github.run_number }} ./easyway-backend
          docker tag pritxsh/app-backend:${{ github.run_number }} pritxsh/app-backend:latest

      - name: Push Docker Images
        run: |
          docker push pritxsh/app-frontend:${{ github.run_number }}
          docker push pritxsh/app-frontend:latest
          docker push pritxsh/app-backend:${{ github.run_number }}
          docker push pritxsh/app-backend:latest
